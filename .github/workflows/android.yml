name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST262_COMMIT: 5992dc3b60faf62a48fd6be8a40ae9d9a8c84d81

jobs:
  emulator:
    name: Emulator, API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # 26: the engine's minimum (Android 8.0); 34: a recent ART
        api-level: [26, 34]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew :neonjs-test262:installDist :neonjs-test262:d8Libs
      - name: Check out Test262
        run: |
          git init -q third_party/test262
          git -C third_party/test262 fetch -q --depth 1 https://github.com/tc39/test262.git "$TEST262_COMMIT"
          git -C third_party/test262 checkout -q FETCH_HEAD
      - name: Dex the test runner (with dx, and with D8)
        run: |
          python3 tools/android/bundle.py --out build/android/neonjs-test262.jar neonjs-test262/build/install/neonjs-test262/lib
          python3 tools/android/bundle.py --out build/android/neonjs-test262-d8.jar neonjs-test262/build/install/neonjs-test262/lib neonjs-test262/build/d8-libs
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: tools/android/ci-emulator.sh
