name: Release

# Pushing a tag vX.Y.Z publishes dev.mooner.neonjs:*:X.Y.Z to Maven Central. The deployment is uploaded and validated;
# it becomes public when it is published from https://central.sonatype.com/publishing/deployments (docs/RELEASING.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || [[ "$version" == *SNAPSHOT* ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not a release version (vX.Y.Z or vX.Y.Z-qualifier)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build and unit tests
        run: ./gradlew build -Pversion="$VERSION"
      - name: Upload to the Central Portal
        # publishing releases does not support the configuration cache yet (Gradle issue 22779)
        run: ./gradlew publishToMavenCentral -Pversion="$VERSION" --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
